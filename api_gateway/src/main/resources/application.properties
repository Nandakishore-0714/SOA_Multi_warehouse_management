
spring.application.name=api_gateway
server.port=8080

# Eureka Server Configuration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Auth Service Route
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[0].filters[0]=JwtAuthFilter

# Product Service Route
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://PRODUCT-SERVICE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**
spring.cloud.gateway.server.webflux.routes[1].filters[0]=JwtAuthFilter

# Inventory Service Route
spring.cloud.gateway.server.webflux.routes[2].id=inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://INVENTORY-SERVICE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/inventory/**
spring.cloud.gateway.server.webflux.routes[2].filters[0]=JwtAuthFilter
spring.cloud.gateway.server.webflux.routes[2].filters[1]=StripPrefix=1

# Order Service Route
spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ORDER-SERVICE
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/orders/**
spring.cloud.gateway.server.webflux.routes[3].filters[0]=JwtAuthFilter
spring.cloud.gateway.server.webflux.routes[3].filters[1]=StripPrefix=1
